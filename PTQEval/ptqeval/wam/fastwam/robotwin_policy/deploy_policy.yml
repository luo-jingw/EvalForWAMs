# RoboTwin policy config for the fastwam ViDiT-Q variant. Mirrors FastWAM's
# deploy_policy.yml and adds the variant-dispatch keys read by
# ptqeval.wam.fastwam.policy.get_model. The eval runner overrides task_name /
# ckpt_setting / dataset_stats_path / variant / int_weights_ckpt /
# perf_log_path at launch.
policy_name: fastwam_viditq
task_name: null
task_config: null
ckpt_setting: null
seed: 0
instruction_type: unseen
eval_num_episodes: 100

# fastwam policy args
sim_cfg_path: null
sim_task: null
sim_cfg_name: sim_robotwin.yaml
mixed_precision: bf16
device: cuda
dataset_stats_path: null
action_horizon: null
replan_steps: 24
num_inference_steps: 10
sigma_shift: null
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: cpu
tiled: false
timing_enabled: false
skip_get_obs_within_replan: true

# variant dispatch (ptqeval.wam.fastwam.policy)
variant: ""              # "" | "bf16" | "viditq"
int_weights_ckpt: null   # required when variant == viditq
layer_config: null       # optional, logging only
profile_ops: true
perf_log_path: null      # JSONL PerfProbe output (required when profile_ops)
