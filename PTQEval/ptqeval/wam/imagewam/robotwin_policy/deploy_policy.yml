# RoboTwin deploy config for the imagewam ViDiT-Q variant. = ImageWAM's own
# imagewam_policy/deploy_policy.yml + the ptqeval variant-dispatch keys. RoboTwin
# script/eval_policy.py loads this as base usr_args, applies --overrides, then
# imports policy_name (this package, symlinked to policy/imagewam_viditq) and
# calls its get_model/eval/reset_model (-> ptqeval.wam.imagewam.policy).
policy_name: imagewam_viditq
task_name: null
task_config: null
ckpt_setting: null
seed: 0
instruction_type: unseen
eval_num_episodes: 100

# imagewam policy args (composed/forwarded by eval_runner)
sim_cfg_path: null
sim_task: null
sim_cfg_name: sim_robotwin.yaml
model_overrides: null
mixed_precision: bf16
device: cuda
dataset_stats_path: null
action_horizon: null
replan_steps: 8
num_inference_steps: 10
sigma_shift: null
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: cpu
tiled: false
timing_enabled: false
skip_get_obs_within_replan: false
robotwin_camera_layout: compact_288x256

# ptqeval ViDiT-Q variant dispatch (read by ptqeval.wam.imagewam.policy.get_model)
variant: ""
int_weights_ckpt: null
layer_config: null
calib_out: null
profile_ops: "true"
perf_log_path: null
